name: Feather

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feather-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  checks:
    name: Lint and package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace dependencies
        run: uv sync --all-packages --all-extras --no-extra token-count --locked
      - name: Lint
        run: uv run --no-sync ruff check feather-harness/src feather-harness/tests feather-train/src feather-train/tests feather-eval/src feather-eval/tests scripts
      - name: Harness tests
        run: uv run --no-sync pytest -c feather-harness/pyproject.toml feather-harness/tests -q
      - name: Train tests without Docker
        run: uv run --no-sync pytest -c feather-train/pyproject.toml feather-train/tests -m 'not docker' -q
      - name: Eval tests
        run: uv run --no-sync pytest -c feather-eval/pyproject.toml feather-eval/tests -q

  docker:
    name: Docker integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Train dependencies
        run: uv sync --package feather-train --extra training --extra dev --locked
      - name: Build sandbox test image
        run: docker build -t feather-e2b-test -f feather-train/tests/Dockerfile feather-train/tests
      - name: Run Docker tests
        run: uv run --no-sync pytest -c feather-train/pyproject.toml feather-train/tests -m docker -q

  windows-file-tools:
    name: Windows file portability
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
      - name: Install ripgrep
        run: choco install ripgrep --yes --no-progress
      - name: Install dependencies
        run: uv sync --package feather-harness --extra dev --locked
      - name: File portability tests
        run: uv run --no-sync pytest -c feather-harness/pyproject.toml feather-harness/tests/tools/test_windows_portability.py -q

  distributions:
    name: Build and install distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
      - name: Verify isolated CLI installation
        run: |
          bash -n install.sh
          uv run --no-project --python 3.12 python scripts/check_install.py
      - name: Build wheels and source distributions
        run: uv build --all-packages --out-dir dist
      - name: Install wheels outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/feather-wheels"
          uv pip install --python "$RUNNER_TEMP/feather-wheels/bin/python" dist/*.whl
      - name: Check installed entrypoints and bundled runtime
        working-directory: ${{ runner.temp }}
        run: |
          feather-wheels/bin/feather --help
          feather-wheels/bin/feather-atif --help
          feather-wheels/bin/python -m feather_train.sandbox.runtime feather-runtime.tar.gz
          feather-wheels/bin/python - <<'PY'
          import tarfile
          with tarfile.open("feather-runtime.tar.gz") as bundle:
              names = set(bundle.getnames())
          assert {"runtime/read_tool.py", "runtime/process_worker.py", "runtime/call.py", "host/remote.py"} <= names
          for skill in ("docx", "pptx", "xlsx", "pdf"):
              assert f"skills/{skill}/SKILL.md" in names, skill
          PY
